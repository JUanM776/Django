<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            padding: 50px 40px;
        }
        .check-icon {
            font-size: 5rem;
            color: #28a745;
        }
        .btn-outline-primary {
            border-color: #667eea;
            color: #667eea;
            border-radius: 25px;
            padding: 10px 30px;
        }
        .btn-outline-primary:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="check-icon">✅</div>
                    <h2 class="mt-3 mb-3">¡Solicitud Enviada!</h2>
                    <p class="text-muted mb-4">
                        Su solicitud ha sido registrada exitosamente en el sistema.
                        Será atendida a la brevedad posible.
                    </p>
                    <a href="{% url 'solicitudes:formulario' %}" class="btn btn-outline-primary">
                        Nueva Solicitud
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
